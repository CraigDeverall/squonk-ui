<!--
  Manager iframe equivalent of preview-head.html: paints the chrome
  surface to the dark color before Storybook bootstraps, so the
  sidebar/toolbar doesn't flash white when reloading in dark mode.
-->
<script>
  (function () {
    try {
      var raw = localStorage.getItem("squonk-storybook-mode");
      var mode = raw === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-mode", mode);
      var bg = mode === "dark" ? "#0d1117" : "#ffffff";
      var fg = mode === "dark" ? "#f0f6fc" : "#212529";
      var style = document.createElement("style");
      style.textContent =
        "html, body { background-color: " +
        bg +
        " !important; color: " +
        fg +
        "; }";
      document.head.appendChild(style);
    } catch (e) {
      /* fall through to defaults */
    }
  })();
</script>

<!--
  Makes the published site installable as an app (Windows, macOS, Android,
  iOS). The service worker only registers over HTTPS, so local Storybook is
  unaffected.
-->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
<meta
  name="theme-color"
  content="#ffffff"
  media="(prefers-color-scheme: light)"
/>
<meta
  name="theme-color"
  content="#0d1117"
  media="(prefers-color-scheme: dark)"
/>
<meta name="apple-mobile-web-app-title" content="SquonkUI" />
<meta name="mobile-web-app-capable" content="yes" />
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* the site still works without it */
    });
  }
</script>
<!--
  Back from the sign-in (see pages-session.ts): a sign-in proxy can return
  to the path but drop the query, where Storybook keeps the current page.
  Put it back before Storybook reads the URL.
-->
<script>
  (function () {
    try {
      var saved = sessionStorage.getItem("squonk-pages-return-to");
      if (!saved) return;
      sessionStorage.removeItem("squonk-pages-return-to");
      var target = new URL(saved);
      if (
        target.origin === location.origin &&
        target.pathname === location.pathname &&
        !location.search &&
        target.search
      ) {
        history.replaceState(history.state, "", target.href);
      }
    } catch (e) {
      /* stay where the sign-in left us */
    }
  })();
</script>
